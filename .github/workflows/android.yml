name: Android

# Builds and checks the Android app when android/ changes. ci.yml already
# builds the Go core for Android on every push.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # versionCode counts the commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make android-core
        run: make android-core ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
      - name: Test, lint and build the debug APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cd android
          ./gradlew --no-daemon testDebugUnitTest lint assembleDebug

  # The emulator smoke tests of scripts/ui-smoke.sh that need no account:
  # the cold start with the yt-dlp update, Acerca de and Enviar registro.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make android-core (x86_64)
        run: make android-core ANDROID_ABI=x86_64 ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
      - name: Build the x86_64 debug APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cd android
          ./gradlew --no-daemon -PcliampAbi=x86_64 assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          # The runner runs each line on its own with sh.
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            scripts/ui-smoke.sh shots s1 about sendlog
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-smoke
          path: android/shots
          if-no-files-found: ignore
