name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev
      - name: Install shellcheck
        # Keep SHELLCHECK_VERSION equal to the shellcheck line in mise.toml.
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - run: make tools
      - name: make ci
        # shell: bash sets pipefail, so a failure of make ci fails the step.
        shell: bash
        run: make ci TESTFLAGS=-v 2>&1 | tee "$RUNNER_TEMP/ci.log"
      - name: List skipped tests
        # make ci ran the tests once with -v. Each package prints its tests
        # and then its ok line, so each skip gets the package of that line.
        run: >-
          awk '/^[[:space:]]*--- SKIP: / { skips[n++] = $3 }
          /^ok[[:space:]]/ { for (i = 0; i < n; i++) print $2 " " skips[i]; n = 0 }'
          "$RUNNER_TEMP/ci.log"

  # Builds the Go core of the Android app, so a new //go:build linux file
  # that breaks GOOS=android fails here. The runner image ships the NDK.
  android-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make android-core
        run: |
          make android-core ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          make android-core ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_ABI=x86_64
          # Android 15+ kernels can use 16 KB pages: every LOAD segment needs that alignment.
          readelf -lW android/app/src/main/jniLibs/arm64-v8a/libcliamp.so | awk '/LOAD/ && $NF != "0x4000" { bad = 1 } END { exit bad }'
