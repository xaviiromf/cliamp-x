name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 8 ships glibc 2.28, so the binary runs on every distribution
    # from that age on: Ubuntu 20.04+, Debian 10+, Fedora, RHEL 8+,
    # openSUSE, Arch and their derivatives. Only libasound and glibc are
    # linked.
    container: almalinux:8
    steps:
      - name: Install build tools
        run: dnf install -y gcc make git tar gzip xz alsa-lib-devel
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make build
          ./cliamp-x --version
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0-$(git rev-parse --short HEAD)" ;; esac
          export VERSION
          mkdir -p dist cliamp-x-pkg/cliamp-x
          cp cliamp-x "dist/cliamp-x-linux-$ARCH"
          cp cliamp-x cliamp-x.desktop Cliamp.svg LICENSE README.md config.toml.example cliamp-x-pkg/cliamp-x/
          tar -C cliamp-x-pkg -czf "dist/cliamp-x-linux-$ARCH.tar.gz" cliamp-x
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p deb -t dist/
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cliamp-x-linux-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "cliamp-x $GITHUB_REF_NAME" --generate-notes
