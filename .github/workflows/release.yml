name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 8 ships glibc 2.28, so the binary runs on every distribution
    # from that age on: Ubuntu 20.04+, Debian 10+, Fedora, RHEL 8+,
    # openSUSE, Arch and their derivatives. Only libasound and glibc are
    # linked.
    container: almalinux:8
    steps:
      - name: Install build tools
        run: dnf install -y gcc make git tar gzip xz alsa-lib-devel
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make build
          ./cliamp-x --version
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0-$(git rev-parse --short HEAD)" ;; esac
          export VERSION
          mkdir -p dist cliamp-x-pkg/cliamp-x
          cp cliamp-x "dist/cliamp-x-linux-$ARCH"
          cp cliamp-x cliamp-x.desktop Cliamp.svg LICENSE README.md config.toml.example cliamp-x-pkg/cliamp-x/
          tar -C cliamp-x-pkg -czf "dist/cliamp-x-linux-$ARCH.tar.gz" cliamp-x
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p deb -t dist/
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cliamp-x-linux-${{ matrix.arch }}
          path: dist/*

  android:
    runs-on: ubuntu-24.04
    # The signing secrets live in this environment, which only android,
    # main and v* tags may use.
    environment: release
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # versionCode counts the commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the signing secrets and the app
        # A tag without android/ or without the release keystore publishes no
        # APK. The Linux release goes on; an unsigned APK is never published.
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          build=true
          if [ ! -d android ]; then
            echo "::warning::This tag has no android/ directory, so the release has no APK."
            build=false
          fi
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::The secret $name of the release environment is not set, so the release has no APK. PLAN.md phase 0 step 4 creates the keystore and its secrets."
              build=false
            fi
          done
          echo "BUILD_APK=$build" >> "$GITHUB_ENV"
      - name: Set up Go
        if: env.BUILD_APK == 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the signed APK
        if: env.BUILD_APK == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          # The core and the APK report the same version, so the app's
          # update check compares them correctly.
          make android-core VERSION="$GITHUB_REF_NAME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          (cd android && ./gradlew --no-daemon -PcliampVersion="$GITHUB_REF_NAME" :app:assembleRelease)
          rm -f "$ANDROID_KEYSTORE_FILE"
          signed=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          # Any key passes verify, so pin the certificate of the release key:
          # an APK signed with another key could never update installed apps.
          certs=$("$apksigner" verify --print-certs "$signed")
          echo "$certs"
          cert=$(grep -m1 'certificate SHA-256 digest:' <<<"$certs" | awk '{print $NF}')
          if [ "$cert" != "$ANDROID_CERT_SHA256" ]; then
            echo "::error::The APK is signed with $cert, not the release certificate $ANDROID_CERT_SHA256 (repository variable ANDROID_CERT_SHA256)."
            exit 1
          fi
          mkdir dist
          cp "$signed" "dist/cliamp-x-${GITHUB_REF_NAME#v}-arm64-v8a.apk"
      - name: Upload artifact
        if: env.BUILD_APK == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cliamp-x-android
          path: dist/*

  release:
    # A failed Android build stops the release, so it never ships without the
    # APK; an android job skipped for missing secrets or android/ still lets the
    # Linux release out.
    needs: [build, android]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v2.3.0-rc.1) is a prerelease, so the stable
          # channel of the app never offers it.
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* "${pre[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "cliamp-x $GITHUB_REF_NAME" --generate-notes
