# nfpm builds the .deb and .rpm packages of a release:
#   VERSION=1.0.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb
name: cliamp-x
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: xaviiromf <https://github.com/xaviiromf>
description: |
  Terminal YouTube Music player inspired by Winamp, with your account's
  library, no ads, genre EQ presets, visualizers and local files.
vendor: cliamp-x
homepage: https://github.com/xaviiromf/cliamp-x
license: MIT
contents:
  - src: ./cliamp-x
    dst: /usr/bin/cliamp-x
    file_info:
      mode: 0755
  - src: ./cliamp-x.desktop
    dst: /usr/share/applications/cliamp-x.desktop
  - src: ./Cliamp.svg
    dst: /usr/share/icons/hicolor/scalable/apps/cliamp-x.svg
  - src: ./LICENSE
    dst: /usr/share/licenses/cliamp-x/LICENSE
overrides:
  deb:
    depends:
      - libasound2
      - ffmpeg
    recommends:
      - yt-dlp
      - pipewire-alsa
  rpm:
    depends:
      - alsa-lib
    recommends:
      - ffmpeg
      - yt-dlp
      - pipewire-alsa
